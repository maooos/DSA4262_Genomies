server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://queries:8081;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ \.mjs$ { default_type application/javascript; }
    # The browser decodes these gzip files explicitly, on demand.
    location ~ \.json\.gz$ { default_type application/gzip; }
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
}
